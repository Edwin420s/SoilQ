[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soilq"
version = "0.1.0"
description = "Reproducible quantum-assisted soil-water classification research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<4", "pandas>=2.1,<4", "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2", "qiskit>=1.2,<3", "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "streamlit>=1.32,<2", "joblib>=1.3,<2", "openpyxl>=3.1,<4", "pyarrow>=15,<25",
  "plotly>=5.18,<7", "matplotlib>=3.8,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
